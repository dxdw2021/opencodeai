<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenCode 模型测试工具</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #1a1a25;
      --bg-card-hover: #222230;
      --text-primary: #ffffff;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --accent-orange: #f59e0b;
      --accent-purple: #8b5cf6;
      --border-color: rgba(255, 255, 255, 0.08);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
    }
    .header {
      background: linear-gradient(180deg, var(--bg-secondary) 0%, transparent 100%);
      padding: 1.5rem 2rem 3rem;
      text-align: center;
    }
    .header h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
    .header .subtitle { color: var(--text-secondary); font-size: 0.9rem; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 1rem 2rem; }

    /* Fetch Panel */
    .fetch-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .fetch-panel h2 { font-size: 1.1rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    .fetch-row { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
    .fetch-info { flex: 1; min-width: 200px; }
    .fetch-info label { display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.5rem; }
    .fetch-info input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      color: var(--text-primary);
      font-size: 0.9rem;
      font-family: monospace;
    }
    .fetch-info input:focus { outline: none; border-color: var(--accent-blue); }

    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-primary { background: var(--accent-blue); color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn-primary:disabled { background: var(--text-muted); cursor: not-allowed; }
    .btn-green { background: var(--accent-green); color: white; }
    .btn-green:hover { background: #059669; }
    .btn-secondary { background: var(--bg-primary); color: var(--text-secondary); border: 1px solid var(--border-color); }
    .btn-secondary:hover { background: var(--bg-card-hover); color: var(--text-primary); }

    /* Stats */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .stat-item {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 0.75rem;
      padding: 1rem;
      text-align: center;
    }
    .stat-item .value { font-size: 1.5rem; font-weight: 700; }
    .stat-item .label { font-size: 0.8rem; color: var(--text-secondary); }

    /* Test Panel */
    .test-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .test-panel h2 { font-size: 1.1rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    .form-row { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .form-group { flex: 1; min-width: 200px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.5rem; }
    .form-group select, .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      color: var(--text-primary);
      font-size: 0.9rem;
    }
    .form-group select:focus, .form-group input:focus { outline: none; border-color: var(--accent-blue); }
    .form-group textarea {
      width: 100%;
      min-height: 100px;
      padding: 0.75rem 1rem;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      color: var(--text-primary);
      font-size: 0.9rem;
      resize: vertical;
      font-family: inherit;
    }
    .form-group textarea:focus { outline: none; border-color: var(--accent-blue); }
    .options-row { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .option-item { display: flex; align-items: center; gap: 0.5rem; }
    .option-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent-blue); }
    .option-item label { font-size: 0.9rem; color: var(--text-secondary); }
    .btn-row { display: flex; gap: 0.75rem; flex-wrap: wrap; }

    /* Response Panel */
    .response-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }
    .response-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
    }
    .response-header h2 { font-size: 1.1rem; }
    .response-status { padding: 0.25rem 0.75rem; border-radius: 1rem; font-size: 0.8rem; font-weight: 600; }
    .response-status.success { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); }
    .response-status.error { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }
    .response-status.loading { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); }
    .response-content { padding: 1rem 1.5rem; max-height: 300px; overflow-y: auto; }
    .response-content pre {
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 0.85rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .response-time {
      padding: 0.5rem 1.5rem;
      background: var(--bg-primary);
      border-top: 1px solid var(--border-color);
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    /* Model Grid */
    .model-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }
    .model-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 0.75rem;
      padding: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .model-card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.15); }
    .model-card.selected { border-color: var(--accent-blue); background: rgba(59, 130, 246, 0.1); }
    .model-card .name { font-family: monospace; font-size: 0.95rem; font-weight: 600; margin-bottom: 0.5rem; }
    .model-card .desc { font-size: 0.85rem; color: var(--text-secondary); }
    .model-card .tag {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 0.25rem;
      font-size: 0.7rem;
      font-weight: 600;
      margin-top: 0.5rem;
    }
    .tag.free { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); }
    .tag.paid { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); }
    .tag.unknown { background: rgba(107, 114, 128, 0.15); color: var(--text-muted); }

    /* Filter */
    .filter-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .filter-btn {
      padding: 0.5rem 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      color: var(--text-secondary);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover { background: var(--bg-card-hover); color: var(--text-primary); }
    .filter-btn.active { background: var(--accent-blue); color: white; border-color: var(--accent-blue); }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      padding: 0.75rem 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--accent-green);
      border-radius: 0.75rem;
      opacity: 0;
      transition: all 0.3s;
      z-index: 1000;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.error { border-color: var(--accent-red); }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Loading Overlay */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(10, 10, 15, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .loading-content { text-align: center; }
    .loading-content .spinner-large {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      border-top-color: var(--accent-blue);
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    .loading-content p { color: var(--text-secondary); }

    @media (max-width: 640px) {
      .header h1 { font-size: 1.5rem; }
      .form-row, .btn-row, .fetch-row { flex-direction: column; }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔬 OpenCode 模型测试工具</h1>
    <p class="subtitle">获取模型列表并在线测试 AI 模型</p>
  </div>

  <div class="container">
    <!-- Fetch Panel -->
    <div class="fetch-panel">
      <h2>📡 获取模型列表</h2>
      <div class="fetch-row">
        <div class="fetch-info">
          <label>API Endpoint</label>
          <input type="text" id="apiUrl" value="https://opencode.ai/zen/v1">
        </div>
        <button class="btn btn-green" id="fetchBtn" onclick="fetchModels()">
          <span>🔄</span> 获取模型列表
        </button>
        <button class="btn btn-secondary" onclick="loadDefaultModels()">
          <span>📦</span> 加载默认列表
        </button>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-item">
        <div class="value" id="totalCount">-</div>
        <div class="label">总模型数</div>
      </div>
      <div class="stat-item">
        <div class="value" id="freeCount" style="color: var(--accent-green);">-</div>
        <div class="label">免费可用</div>
      </div>
      <div class="stat-item">
        <div class="value" id="unknownCount" style="color: var(--text-muted);">-</div>
        <div class="label">未测试</div>
      </div>
    </div>

    <!-- Filter -->
    <div class="filter-row">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">全部</button>
      <button class="filter-btn" data-filter="free" onclick="setFilter('free')">免费</button>
      <button class="filter-btn" data-filter="unknown" onclick="setFilter('unknown')">未测试</button>
    </div>

    <!-- Model Grid -->
    <div class="model-grid" id="modelGrid"></div>

    <!-- Test Panel -->
    <div class="test-panel">
      <h2>🧪 测试模型</h2>
      <div class="form-row">
        <div class="form-group" style="flex: 2;">
          <label>选择的模型</label>
          <input type="text" id="selectedModel" value="minimax-m2.5-free" readonly>
        </div>
        <div class="form-group">
          <label>API Key</label>
          <input type="text" id="apiKey" value="public">
        </div>
      </div>
      <div class="form-group">
        <label>消息内容</label>
        <textarea id="prompt" placeholder="输入你的问题...">Hello! Reply with just "OK".</textarea>
      </div>
      <div class="options-row">
        <div class="option-item">
          <input type="checkbox" id="streamMode">
          <label for="streamMode">流式输出 (Stream)</label>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="sendBtn" onclick="sendRequest()">
          <span>🚀</span> 发送请求
        </button>
        <button class="btn btn-secondary" onclick="clearResponse()">
          <span>🗑️</span> 清空
        </button>
      </div>
    </div>

    <!-- Response Panel -->
    <div class="response-panel">
      <div class="response-header">
        <h2>📥 响应结果</h2>
        <span class="response-status" id="responseStatus" style="display: none;">就绪</span>
      </div>
      <div class="response-content">
        <pre id="responseContent" style="color: var(--text-secondary);">响应内容将显示在这里...</pre>
      </div>
      <div class="response-time" id="responseTime" style="display: none;">
        耗时: <span id="timeValue">0</span> ms
      </div>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay" style="display: none;">
    <div class="loading-content">
      <div class="spinner-large"></div>
      <p id="loadingText">正在获取模型列表...</p>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API_URL = 'https://opencode.ai/zen/v1';
    let allModels = [];
    let currentFilter = 'all';
    let freeModelsSet = new Set(['gpt-5-nano', 'big-pickle', 'minimax-m2.5-free', 'hy3-preview-free', 'nemotron-3-super-free']);

    // Default models
    const defaultModels = [
      'gpt-5-nano', 'big-pickle', 'minimax-m2.5-free', 'hy3-preview-free', 'nemotron-3-super-free',
      'claude-opus-4-7', 'claude-opus-4-6', 'claude-opus-4-5', 'claude-opus-4-1',
      'claude-sonnet-4-6', 'claude-sonnet-4-5', 'claude-sonnet-4',
      'claude-3-5-haiku', 'claude-haiku-4-5',
      'gemini-3.1-pro', 'gemini-3-pro', 'gemini-3-flash',
      'gpt-5.4', 'gpt-5.4-pro', 'gpt-5.4-mini', 'gpt-5.4-nano',
      'gpt-5.3-codex-spark', 'gpt-5.3-codex',
      'gpt-5.2', 'gpt-5.2-codex',
      'gpt-5.1', 'gpt-5.1-codex-max', 'gpt-5.1-codex', 'gpt-5.1-codex-mini',
      'gpt-5', 'gpt-5-codex',
      'glm-5.1', 'glm-5', 'glm-4.7', 'glm-4.6',
      'minimax-m2.7', 'minimax-m2.5', 'minimax-m2.5-free',
      'kimi-k2.6', 'kimi-k2.5', 'kimi-k2',
      'qwen3.6-plus', 'qwen3.5-plus',
      'big-pickle', 'nemotron-3-super-free',
    ];

    // Fetch models from API
    async function fetchModels() {
      const url = document.getElementById('apiUrl').value.trim();
      if (!url) {
        showToast('请输入 API 地址', true);
        return;
      }

      showLoading('正在获取模型列表...');
      document.getElementById('fetchBtn').disabled = true;

      try {
        const response = await fetch(`${url}/models`, {
          headers: { 'Authorization': `Bearer public` }
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        allModels = data.data.map(m => m.id).filter((v, i, a) => a.indexOf(v) === i);
        
        updateStats();
        renderModels();
        showToast(`成功获取 ${allModels.length} 个模型！`);
      } catch (error) {
        showToast(`获取失败: ${error.message}`, true);
      } finally {
        hideLoading();
        document.getElementById('fetchBtn').disabled = false;
      }
    }

    // Load default models
    function loadDefaultModels() {
      allModels = [...new Set(defaultModels)];
      freeModelsSet = new Set(['gpt-5-nano', 'big-pickle', 'minimax-m2.5-free', 'hy3-preview-free', 'nemotron-3-super-free']);
      updateStats();
      renderModels();
      showToast(`已加载 ${allModels.length} 个默认模型`);
    }

    // Update stats
    function updateStats() {
      const freeCount = allModels.filter(m => freeModelsSet.has(m)).length;
      document.getElementById('totalCount').textContent = allModels.length;
      document.getElementById('freeCount').textContent = freeCount;
      document.getElementById('unknownCount').textContent = allModels.length - freeCount;
    }

    // Set filter
    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === filter);
      });
      renderModels();
    }

    // Render models
    function renderModels() {
      const grid = document.getElementById('modelGrid');
      const filtered = allModels.filter(m => {
        if (currentFilter === 'all') return true;
        if (currentFilter === 'free') return freeModelsSet.has(m);
        if (currentFilter === 'unknown') return !freeModelsSet.has(m);
        return true;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div style="text-align:center; padding:2rem; color:var(--text-secondary);">没有找到匹配的模型</div>';
        return;
      }

      grid.innerHTML = filtered.map(m => {
        const isFree = freeModelsSet.has(m);
        const tag = isFree ? 'free' : 'unknown';
        const tagText = isFree ? 'FREE' : '未测试';
        return `
          <div class="model-card" onclick="selectModel('${m}')" data-model="${m}">
            <div class="name">${m}</div>
            <div class="desc">点击选择此模型进行测试</div>
            <span class="tag ${tag}">${tagText}</span>
          </div>
        `;
      }).join('');
    }

    // Select model
    function selectModel(modelId) {
      document.getElementById('selectedModel').value = modelId;
      document.querySelectorAll('.model-card').forEach(card => {
        card.classList.toggle('selected', card.dataset.model === modelId);
      });
    }

    // Send request
    async function sendRequest() {
      const btn = document.getElementById('sendBtn');
      const status = document.getElementById('responseStatus');
      const content = document.getElementById('responseContent');
      const timeDiv = document.getElementById('responseTime');
      const url = document.getElementById('apiUrl').value.trim();
      const model = document.getElementById('selectedModel').value.trim();
      const apiKey = document.getElementById('apiKey').value.trim();
      const prompt = document.getElementById('prompt').value.trim();
      const stream = document.getElementById('streamMode').checked;

      if (!model) { showToast('请先选择模型', true); return; }
      if (!prompt) { showToast('请输入消息内容', true); return; }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> 发送中...';
      status.style.display = 'inline-block';
      status.className = 'response-status loading';
      status.textContent = '加载中';
      content.style.color = 'var(--text-secondary)';
      content.textContent = '正在等待响应...';
      timeDiv.style.display = 'none';

      const startTime = Date.now();

      try {
        const response = await fetch(`${url}/chat/completions`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({ model, messages: [{ role: 'user', content: prompt }], stream })
        });

        const elapsed = Date.now() - startTime;

        if (stream) {
          content.style.color = 'var(--text-primary)';
          content.textContent = '';
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let fullContent = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            const chunk = decoder.decode(value);
            for (const line of chunk.split('\n')) {
              if (line.startsWith('data: ')) {
                const data = line.slice(6);
                if (data === '[DONE]') continue;
                try {
                  const json = JSON.parse(data);
                  const text = json.choices?.[0]?.delta?.content || '';
                  if (text) {
                    fullContent += text;
                    content.textContent = fullContent;
                  }
                } catch (e) {}
              }
            }
          }
          status.className = 'response-status success';
          status.textContent = '成功 (流式)';
        } else {
          const data = await response.json();
          if (data.error) {
            status.className = 'response-status error';
            status.textContent = '错误';
            content.style.color = 'var(--accent-red)';
            
            // Check if this model works - add to free list
            if (data.error.message?.includes('Missing API key')) {
              // Model doesn't need key but requires payment
            } else {
              // Model might be free - add to free set
              freeModelsSet.add(model);
              updateStats();
              renderModels();
            }
            
            content.textContent = JSON.stringify(data, null, 2);
          } else {
            status.className = 'response-status success';
            status.textContent = '成功';
            content.style.color = 'var(--accent-green)';
            
            // Success! This model works with public key
            freeModelsSet.add(model);
            updateStats();
            renderModels();
            
            content.textContent = data.choices?.[0]?.message?.content || JSON.stringify(data, null, 2);
          }
        }

        timeDiv.style.display = 'block';
        document.getElementById('timeValue').textContent = elapsed;

      } catch (error) {
        status.className = 'response-status error';
        status.textContent = '请求失败';
        content.style.color = 'var(--accent-red)';
        content.textContent = `错误: ${error.message}`;
      }

      btn.disabled = false;
      btn.innerHTML = '<span>🚀</span> 发送请求';
    }

    function clearResponse() {
      document.getElementById('responseContent').textContent = '响应内容将显示在这里...';
      document.getElementById('responseContent').style.color = 'var(--text-secondary)';
      document.getElementById('responseStatus').style.display = 'none';
      document.getElementById('responseTime').style.display = 'none';
    }

    function showLoading(text) {
      document.getElementById('loadingText').textContent = text;
      document.getElementById('loadingOverlay').style.display = 'flex';
    }

    function hideLoading() {
      document.getElementById('loadingOverlay').style.display = 'none';
    }

    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.toggle('error', isError);
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // Init
    loadDefaultModels();
  </script>
</body>
</html>
