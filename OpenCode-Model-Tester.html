<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenCode 模型测试工具 v2.0</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #1a1a25;
      --bg-card-hover: #222230;
      --text-primary: #ffffff;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --accent-orange: #f59e0b;
      --accent-purple: #8b5cf6;
      --border-color: rgba(255, 255, 255, 0.08);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
    }
    .header {
      background: linear-gradient(180deg, var(--bg-secondary) 0%, transparent 100%);
      padding: 1.5rem 2rem 3rem;
      text-align: center;
    }
    .header h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
    .header .subtitle { color: var(--text-secondary); font-size: 0.9rem; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 1rem 2rem; }

    .fetch-panel, .test-panel, .response-panel, .model-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .fetch-panel h2, .test-panel h2, .response-header h2, .model-section h2 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .form-row { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .form-group { flex: 1; min-width: 200px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.5rem; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      color: var(--text-primary);
      font-size: 0.9rem;
    }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent-blue); }
    .form-group textarea {
      width: 100%;
      min-height: 100px;
      padding: 0.75rem 1rem;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      color: var(--text-primary);
      font-size: 0.9rem;
      resize: vertical;
      font-family: inherit;
    }
    .form-group textarea:focus { outline: none; border-color: var(--accent-blue); }

    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-primary { background: var(--accent-blue); color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn-primary:disabled { background: var(--text-muted); cursor: not-allowed; }
    .btn-green { background: var(--accent-green); color: white; }
    .btn-green:hover { background: #059669; }
    .btn-secondary { background: var(--bg-primary); color: var(--text-secondary); border: 1px solid var(--border-color); }
    .btn-secondary:hover { background: var(--bg-card-hover); color: var(--text-primary); }
    .btn-row { display: flex; gap: 0.75rem; flex-wrap: wrap; }

    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.75rem; margin-bottom: 1.5rem; }
    .stat-item { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 0.75rem; padding: 1rem; text-align: center; }
    .stat-item .value { font-size: 1.5rem; font-weight: 700; }
    .stat-item .label { font-size: 0.8rem; color: var(--text-secondary); }

    .filter-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .filter-btn { padding: 0.5rem 1rem; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 0.5rem; color: var(--text-secondary); font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
    .filter-btn:hover { background: var(--bg-card-hover); color: var(--text-primary); }
    .filter-btn.active { background: var(--accent-blue); color: white; border-color: var(--accent-blue); }

    .model-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; max-height: 400px; overflow-y: auto; }
    .model-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 0.75rem; padding: 1rem; cursor: pointer; transition: all 0.2s; }
    .model-card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.15); }
    .model-card.selected { border-color: var(--accent-blue); background: rgba(59, 130, 246, 0.1); }
    .model-card .name { font-family: monospace; font-size: 0.95rem; font-weight: 600; margin-bottom: 0.25rem; }
    .model-card .desc { font-size: 0.8rem; color: var(--text-secondary); }
    .model-card .tag { display: inline-block; padding: 0.15rem 0.4rem; border-radius: 0.25rem; font-size: 0.65rem; font-weight: 600; margin-top: 0.5rem; }
    .tag.free { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); }
    .tag.paid { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); }
    .tag.unknown { background: rgba(107, 114, 128, 0.15); color: var(--text-muted); }
    .tag.error { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }

    .response-panel { overflow: hidden; }
    .response-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 1rem; border-bottom: 1px solid var(--border-color); }
    .response-status { padding: 0.2rem 0.6rem; border-radius: 1rem; font-size: 0.75rem; font-weight: 600; }
    .response-status.success { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); }
    .response-status.error { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }
    .response-status.loading { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); }
    .response-content { padding: 1rem 0; max-height: 300px; overflow-y: auto; }
    .response-content pre { font-family: 'SF Mono', Monaco, monospace; font-size: 0.85rem; line-height: 1.6; white-space: pre-wrap; word-break: break-all; }
    .response-time { padding: 0.5rem 0; border-top: 1px solid var(--border-color); font-size: 0.85rem; color: var(--text-secondary); }

    .options-row { display: flex; gap: 1rem; margin-bottom: 1rem; }
    .option-item { display: flex; align-items: center; gap: 0.5rem; }
    .option-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent-blue); }
    .option-item label { font-size: 0.9rem; color: var(--text-secondary); }

    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px); padding: 0.75rem 1.5rem; background: var(--bg-card); border: 1px solid var(--accent-green); border-radius: 0.75rem; opacity: 0; transition: all 0.3s; z-index: 1000; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.error { border-color: var(--accent-red); }

    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.85rem; border-top: 1px solid var(--border-color); margin-top: 2rem; }

    @media (max-width: 640px) {
      .header h1 { font-size: 1.5rem; }
      .form-row, .btn-row { flex-direction: column; }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔬 OpenCode 模型测试工具</h1>
    <p class="subtitle">独立运行的免费 AI 模型测试器 · 无需服务器</p>
  </div>

  <div class="container">
    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-item">
        <div class="value" id="totalCount">-</div>
        <div class="label">总模型数</div>
      </div>
      <div class="stat-item">
        <div class="value" id="freeCount" style="color: var(--accent-green);">-</div>
        <div class="label">免费可用</div>
      </div>
      <div class="stat-item">
        <div class="value" id="testedCount" style="color: var(--accent-blue);">-</div>
        <div class="label">已测试</div>
      </div>
      <div class="stat-item">
        <div class="value" id="errorCount" style="color: var(--accent-red);">-</div>
        <div class="label">测试失败</div>
      </div>
    </div>

    <!-- Fetch Panel -->
    <div class="fetch-panel">
      <h2>📡 模型列表 <span style="font-size:0.8rem; color:var(--text-muted); font-weight:normal;">(内置最新模型数据，可直接使用)</span></h2>
      <div class="btn-row">
        <button class="btn btn-green" onclick="fetchOnlineModels()">
          <span>🔄</span> 在线获取最新模型
        </button>
        <button class="btn btn-secondary" onclick="resetModels()">
          <span>↺</span> 重置列表
        </button>
      </div>
    </div>

    <!-- Filter -->
    <div class="filter-row">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">全部</button>
      <button class="filter-btn" data-filter="free" onclick="setFilter('free')">免费</button>
      <button class="filter-btn" data-filter="tested" onclick="setFilter('tested')">已测试</button>
      <button class="filter-btn" data-filter="error" onclick="setFilter('error')">失败</button>
    </div>

    <!-- Model Grid -->
    <div class="model-section">
      <h2>📋 模型列表</h2>
      <div class="model-grid" id="modelGrid"></div>
    </div>

    <!-- Test Panel -->
    <div class="test-panel">
      <h2>🧪 测试模型</h2>
      <div class="form-row">
        <div class="form-group" style="flex: 2;">
          <label>选择的模型</label>
          <input type="text" id="selectedModel" value="gpt-5-nano" readonly>
        </div>
        <div class="form-group">
          <label>API Key</label>
          <input type="text" id="apiKey" value="public">
        </div>
      </div>
      <div class="form-group">
        <label>消息内容</label>
        <textarea id="prompt" placeholder="输入你的问题...">Hello! Reply with just "OK".</textarea>
      </div>
      <div class="options-row">
        <div class="option-item">
          <input type="checkbox" id="streamMode">
          <label for="streamMode">流式输出 (Stream)</label>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="sendBtn" onclick="sendRequest()">
          <span>🚀</span> 发送请求
        </button>
        <button class="btn btn-secondary" onclick="testAllFree()">
          <span>⚡</span> 测试所有免费模型
        </button>
        <button class="btn btn-secondary" onclick="clearResponse()">
          <span>🗑️</span> 清空
        </button>
      </div>
    </div>

    <!-- Response Panel -->
    <div class="response-panel">
      <div class="response-header">
        <h2>📥 响应结果</h2>
        <span class="response-status" id="responseStatus" style="display: none;">就绪</span>
      </div>
      <div class="response-content">
        <pre id="responseContent" style="color: var(--text-secondary);">响应内容将显示在这里...</pre>
      </div>
      <div class="response-time" id="responseTime" style="display: none;">
        耗时: <span id="timeValue">0</span> ms
      </div>
    </div>
  </div>

  <div class="footer">
    <p>OpenCode 模型测试工具 v2.0</p>
    <p style="margin-top:0.5rem; font-size:0.8rem;">无需安装，双击即可运行 · 支持 Windows/Mac/Linux</p>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ============ 内置模型数据 ============
    const BUILTIN_MODELS = [
      "claude-opus-4-7","claude-opus-4-6","claude-opus-4-5","claude-opus-4-1",
      "claude-sonnet-4-6","claude-sonnet-4-5","claude-sonnet-4",
      "claude-3-5-haiku","claude-haiku-4-5",
      "gemini-3.1-pro","gemini-3-pro","gemini-3-flash",
      "gpt-5.4","gpt-5.4-pro","gpt-5.4-mini","gpt-5.4-nano",
      "gpt-5.3-codex-spark","gpt-5.3-codex",
      "gpt-5.2","gpt-5.2-codex",
      "gpt-5.1","gpt-5.1-codex-max","gpt-5.1-codex","gpt-5.1-codex-mini",
      "gpt-5","gpt-5-codex","gpt-5-nano",
      "glm-5.1","glm-5",
      "minimax-m2.7","minimax-m2.5","minimax-m2.5-free",
      "kimi-k2.6","kimi-k2.5",
      "qwen3.6-plus","qwen3.5-plus",
      "big-pickle","hy3-preview-free","ling-2.6-flash-free","trinity-large-preview-free","nemotron-3-super-free"
    ];

    // 已知免费模型
    const KNOWN_FREE = new Set(["gpt-5-nano","big-pickle","minimax-m2.5-free","hy3-preview-free","nemotron-3-super-free"]);

    // 状态
    const API_URL = 'https://opencode.ai/zen/v1';
    let allModels = [];
    let modelStates = {}; // free | tested | error
    let currentFilter = 'all';

    // 初始化
    function init() {
      allModels = [...BUILTIN_MODELS];
      BUILTIN_MODELS.forEach(m => {
        if (KNOWN_FREE.has(m)) modelStates[m] = 'free';
        else modelStates[m] = 'unknown';
      });
      updateStats();
      renderModels();
    }

    // 在线获取模型
    async function fetchOnlineModels() {
      showToast('正在获取最新模型列表...');
      try {
        const res = await fetch(`${API_URL}/models`, { headers: { 'Authorization': 'Bearer public' } });
        const data = await res.json();
        const online = data.data.map(m => m.id);
        
        // 合并
        const merged = [...new Set([...BUILTIN_MODELS, ...online])];
        allModels = merged;
        
        // 保留状态
        online.forEach(m => {
          if (!modelStates[m]) modelStates[m] = 'unknown';
        });
        
        updateStats();
        renderModels();
        showToast(`已更新！共 ${allModels.length} 个模型`);
      } catch (e) {
        showToast('获取失败: ' + e.message, true);
      }
    }

    // 重置
    function resetModels() {
      modelStates = {};
      BUILTIN_MODELS.forEach(m => {
        if (KNOWN_FREE.has(m)) modelStates[m] = 'free';
        else modelStates[m] = 'unknown';
      });
      updateStats();
      renderModels();
      showToast('已重置模型列表');
    }

    // 更新统计
    function updateStats() {
      const total = allModels.length;
      const free = allModels.filter(m => modelStates[m] === 'free').length;
      const tested = allModels.filter(m => modelStates[m] === 'tested').length;
      const error = allModels.filter(m => modelStates[m] === 'error').length;
      
      document.getElementById('totalCount').textContent = total;
      document.getElementById('freeCount').textContent = free;
      document.getElementById('testedCount').textContent = tested;
      document.getElementById('errorCount').textContent = error;
    }

    // 筛选
    function setFilter(f) {
      currentFilter = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === f));
      renderModels();
    }

    // 渲染模型列表
    function renderModels() {
      const grid = document.getElementById('modelGrid');
      const filtered = allModels.filter(m => {
        if (currentFilter === 'all') return true;
        if (currentFilter === 'free') return modelStates[m] === 'free';
        if (currentFilter === 'tested') return modelStates[m] === 'tested';
        if (currentFilter === 'error') return modelStates[m] === 'error';
        return true;
      });

      if (!filtered.length) {
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:2rem;color:var(--text-secondary)">没有匹配的模型</div>';
        return;
      }

      grid.innerHTML = filtered.map(m => {
        const state = modelStates[m] || 'unknown';
        const tagClass = state === 'free' ? 'free' : state === 'error' ? 'error' : 'unknown';
        const tagText = state === 'free' ? 'FREE' : state === 'error' ? '失败' : '未测试';
        return `<div class="model-card" onclick="selectModel('${m}')" data-model="${m}">
          <div class="name">${m}</div>
          <div class="desc">点击选择此模型</div>
          <span class="tag ${tagClass}">${tagText}</span>
        </div>`;
      }).join('');
    }

    // 选择模型
    function selectModel(id) {
      document.getElementById('selectedModel').value = id;
      document.querySelectorAll('.model-card').forEach(c => c.classList.toggle('selected', c.dataset.model === id));
    }

    // 发送请求
    async function sendRequest() {
      const btn = document.getElementById('sendBtn');
      const status = document.getElementById('responseStatus');
      const content = document.getElementById('responseContent');
      const timeDiv = document.getElementById('responseTime');
      
      const url = API_URL;
      const model = document.getElementById('selectedModel').value.trim();
      const apiKey = document.getElementById('apiKey').value.trim();
      const prompt = document.getElementById('prompt').value.trim();
      const stream = document.getElementById('streamMode').checked;

      if (!model) { showToast('请先选择模型', true); return; }
      if (!prompt) { showToast('请输入消息', true); return; }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> 发送中...';
      status.style.display = 'inline-block';
      status.className = 'response-status loading';
      status.textContent = '加载中';
      content.style.color = 'var(--text-secondary)';
      content.textContent = '正在等待响应...';
      timeDiv.style.display = 'none';

      const startTime = Date.now();

      try {
        const response = await fetch(`${url}/chat/completions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
          body: JSON.stringify({ model, messages: [{ role: 'user', content: prompt }], stream })
        });

        const elapsed = Date.now() - startTime;

        if (stream) {
          content.style.color = 'var(--text-primary)';
          content.textContent = '';
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let full = '';
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            for (const line of decoder.decode(value).split('\n')) {
              if (line.startsWith('data: ')) {
                const d = line.slice(6);
                if (d === '[DONE]') continue;
                try {
                  const t = JSON.parse(d).choices?.[0]?.delta?.content || '';
                  if (t) { full += t; content.textContent = full; }
                } catch (e) {}
              }
            }
          }
          status.className = 'response-status success';
          status.textContent = '成功 (流式)';
          modelStates[model] = 'free';
        } else {
          const data = await response.json();
          if (data.error) {
            status.className = 'response-status error';
            status.textContent = '错误';
            content.style.color = 'var(--accent-red)';
            const errMsg = data.error.message || '';
            if (errMsg.includes('Missing API key') || errMsg.includes('CreditsError')) {
              modelStates[model] = 'error';
            } else {
              modelStates[model] = 'tested';
            }
          } else {
            status.className = 'response-status success';
            status.textContent = '成功';
            content.style.color = 'var(--accent-green)';
            modelStates[model] = 'free';
            content.textContent = data.choices?.[0]?.message?.content || JSON.stringify(data, null, 2);
          }
        }

        timeDiv.style.display = 'block';
        document.getElementById('timeValue').textContent = elapsed;
        updateStats();
        renderModels();

      } catch (e) {
        status.className = 'response-status error';
        status.textContent = '失败';
        content.style.color = 'var(--accent-red)';
        content.textContent = '错误: ' + e.message;
        modelStates[model] = 'error';
        updateStats();
        renderModels();
      }

      btn.disabled = false;
      btn.innerHTML = '<span>🚀</span> 发送请求';
    }

    // 测试所有免费模型
    async function testAllFree() {
      showToast('开始测试所有模型...');
      const untested = allModels.filter(m => modelStates[m] === 'unknown');
      
      for (const m of untested) {
        document.getElementById('selectedModel').value = m;
        try {
          const res = await fetch(`${API_URL}/chat/completions`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer public' },
            body: JSON.stringify({ model: m, messages: [{ role: 'user', content: 'hi' }], stream: false })
          });
          const data = await res.json();
          modelStates[m] = data.error ? 'error' : 'free';
        } catch (e) {
          modelStates[m] = 'error';
        }
        updateStats();
        renderModels();
        await new Promise(r => setTimeout(r, 500)); // 避免限流
      }
      
      showToast('测试完成！');
    }

    function clearResponse() {
      document.getElementById('responseContent').textContent = '响应内容将显示在这里...';
      document.getElementById('responseContent').style.color = 'var(--text-secondary)';
      document.getElementById('responseStatus').style.display = 'none';
      document.getElementById('responseTime').style.display = 'none';
    }

    function showToast(msg, isErr = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.toggle('error', isErr);
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    init();
  </script>
</body>
</html>
